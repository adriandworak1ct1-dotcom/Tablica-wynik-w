<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siatkówka PRO MAX</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    user-select: none;
}

.top {
    text-align: center;
    padding: 10px;
    background: #111;
    font-size: 16px;
}

.board {
    display: flex;
    height: 80vh;
}

.team {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.left { background: #1e40af; }
.right { background: #991b1b; }

.name {
    font-size: 40px;
    margin-bottom: 10px;
}

.score {
    font-weight: bold;
    line-height: 1;
    transition: font-size 0.2s ease;
}

.sets {
    font-size: 40px;
    margin-top: 10px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    background: #111;
}

button {
    font-size: 16px;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.small {
    background: #444;
    color: white;
}

.full {
    position: fixed;
    bottom: 10px;
    right: 10px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="top">
🏐 PRO MAX — kliknij wynik aby dodać punkt
</div>

<div class="board" id="board">

    <div class="team left" onclick="add('l')">
        <div class="name">LEWA</div>
        <div class="score" id="l">0</div>
        <div class="sets">SETY: <span id="ls">0</span></div>
    </div>

    <div class="team right" onclick="add('r')">
        <div class="name">PRAWA</div>
        <div class="score" id="r">0</div>
        <div class="sets">SETY: <span id="rs">0</span></div>
    </div>

</div>

<div class="controls">
    <button class="small" onclick="undo()">COFNIJ</button>
    <button class="small" onclick="resetMatch()">RESET</button>
</div>

<button class="full" onclick="goFull()">FULL</button>

<script>

// =====================
// STAN GRY
// =====================
let l = 0;
let r = 0;
let ls = 0;
let rs = 0;

let history = [];

const SET_TO = 25;

// =====================
// AUDIO (NAPRAWIONE)
// =====================
let audioCtx = null;

function beep() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 850;
        gain.gain.value = 0.07;

        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);

    } catch (e) {
        // brak crasha
    }
}

// =====================
// FULLSCREEN
// =====================
function goFull() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
}

// auto fullscreen po pierwszym kliknięciu
document.getElementById("board").addEventListener("click", goFull, { once: true });

// =====================
// SKALOWANIE LICZB
// =====================
function fitScores() {

    const lEl = document.getElementById("l");
    const rEl = document.getElementById("r");

    const base = 220;

    lEl.style.fontSize = Math.max(80, base - l.toString().length * 35) + "px";
    rEl.style.fontSize = Math.max(80, base - r.toString().length * 35) + "px";
}

// =====================
// UPDATE
// =====================
function update() {
    document.getElementById("l").innerText = l;
    document.getElementById("r").innerText = r;
    document.getElementById("ls").innerText = ls;
    document.getElementById("rs").innerText = rs;

    fitScores();
}

// =====================
// NOWY SET
// =====================
function newSet(winner) {

    if (winner === 'l') ls++;
    if (winner === 'r') rs++;

    l = 0;
    r = 0;

    beep();

    update();
}

// =====================
// PUNKT
// =====================
function add(team) {

    history.push({l, r, ls, rs});

    if (team === 'l') l++;
    if (team === 'r') r++;

    beep();

    if (l >= SET_TO && l - r >= 2) newSet('l');
    if (r >= SET_TO && r - l >= 2) newSet('r');

    update();
}

// =====================
// COFNIJ
// =====================
function undo() {
    if (history.length > 0) {
        const last = history.pop();
        l = last.l;
        r = last.r;
        ls = last.ls;
        rs = last.rs;
        beep();
        update();
    }
}

// =====================
// RESET
// =====================
function resetMatch() {
    l = 0;
    r = 0;
    ls = 0;
    rs = 0;
    history = [];
    update();
}

// start
update();

</script>

</body>
</html>
