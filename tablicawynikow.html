<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablica Siatkówka OFFLINE</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: black;
    color: white;
    user-select: none;
}

.header {
    text-align: center;
    padding: 10px;
    background: #111;
    font-size: 18px;
}

.board {
    display: flex;
    height: 75vh;
}

.team {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.left {
    background: #1e40af;
}

.right {
    background: #991b1b;
}

.name {
    font-size: 40px;
}

.score {
    font-size: 200px;
    font-weight: bold;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    background: #111;
}

button {
    font-size: 22px;
    padding: 15px 20px;
    border: none;
    border-radius: 10px;
}

.add {
    background: #16a34a;
    color: white;
}

.undo {
    background: #dc2626;
    color: white;
}

.full {
    position: fixed;
    bottom: 10px;
    right: 10px;
    font-size: 12px;
    padding: 5px 10px;
}
</style>
</head>

<body>

<div class="header">
Kliknij ekran → FULLSCREEN | Sterowanie: A = lewa, L = prawa, Z = cofnij
</div>

<div class="board" onclick="goFullScreen()">

    <div class="team left">
        <div class="name">LEWA</div>
        <div class="score" id="left">0</div>
    </div>

    <div class="team right">
        <div class="name">PRAWA</div>
        <div class="score" id="right">0</div>
    </div>

</div>

<div class="buttons">
    <button class="add" onclick="add('l')">+ LEWA</button>
    <button class="undo" onclick="undo()">COFNIJ</button>
    <button class="add" onclick="add('r')">+ PRAWA</button>
</div>

<button class="full" onclick="goFullScreen()">FULL</button>

<script>
let left = 0;
let right = 0;
let history = [];
let setShown = false;

// FULLSCREEN
function goFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    }
}

// DŹWIĘK PIK
function beep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 900;
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    } catch (e) {}
}

// GŁOS
function speak(text) {
    try {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "pl-PL";
        speechSynthesis.speak(msg);
    } catch (e) {}
}

// UPDATE
function update() {
    document.getElementById("left").innerText = left;
    document.getElementById("right").innerText = right;

    // piłka setowa
    if ((left === 24 || right === 24) && !setShown) {
        speak("Piłka setowa");
        setShown = true;
    }

    if (left < 24 && right < 24) {
        setShown = false;
    }
}

// DODAJ
function add(team) {
    history.push({left, right});

    if (team === 'l') left++;
    if (team === 'r') right++;

    beep();
    update();
}

// COFNIJ
function undo() {
    if (history.length > 0) {
        const last = history.pop();
        left = last.left;
        right = last.right;
        beep();
        update();
    }
}

// KLAWIATURA (PC + telefon z klawiaturą)
document.addEventListener("keydown", (e) => {
    if (e.key === "a") add('l');
    if (e.key === "l") add('r');
    if (e.key === "z") undo();
});

// start
update();
</script>

</body>
</html>
