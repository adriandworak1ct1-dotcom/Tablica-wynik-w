<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siatkówka - sterowanie głosem</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
}

.header {
    text-align: center;
    padding: 10px;
    background: #111;
    font-size: 18px;
}

.board {
    display: flex;
    height: 75vh;
}

.team {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.left { background: #1e40af; }
.right { background: #991b1b; }

.name {
    font-size: 40px;
}

.score {
    font-size: 200px;
    font-weight: bold;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    background: #111;
}

button {
    font-size: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
}

.add { background: green; color: white; }
.undo { background: red; color: white; }

.status {
    text-align: center;
    padding: 5px;
    font-size: 14px;
    background: #000;
    color: #0f0;
}
</style>
</head>

<body>

<div class="header">
GŁOS: powiedz "punkt" → "dla nas" / "wasz"
</div>

<div class="status" id="status">Nasłuchiwanie wyłączone</div>

<div class="board">

    <div class="team left">
        <div class="name">LEWA</div>
        <div class="score" id="left">0</div>
    </div>

    <div class="team right">
        <div class="name">PRAWA</div>
        <div class="score" id="right">0</div>
    </div>

</div>

<div class="controls">
    <button class="add" onclick="add('l')">+ LEWA</button>
    <button class="undo" onclick="undo()">COFNIJ</button>
    <button class="add" onclick="add('r')">+ PRAWA</button>
</div>

<script>
let left = 0;
let right = 0;
let history = [];
let armed = false;

const leftEl = document.getElementById("left");
const rightEl = document.getElementById("right");
const statusEl = document.getElementById("status");

// dźwięk
function beep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    o.connect(ctx.destination);
    o.frequency.value = 900;
    o.start();
    o.stop(ctx.currentTime + 0.1);
}

// update
function update() {
    leftEl.textContent = left;
    rightEl.textContent = right;
}

// dodaj punkt
function add(team) {
    history.push({ left, right });

    if (team === "l") left++;
    if (team === "r") right++;

    beep();
    update();
}

// cofnięcie
function undo() {
    if (history.length > 0) {
        const last = history.pop();
        left = last.left;
        right = last.right;
        beep();
        update();
    }
}

// ===== MIKROFON =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    alert("Brak obsługi mikrofonu w tej przeglądarce");
} else {

    const rec = new SpeechRecognition();
    rec.lang = "pl-PL";
    rec.continuous = true;
    rec.interimResults = false;

    rec.onstart = () => {
        statusEl.innerText = "Nasłuchiwanie aktywne";
    };

    rec.onresult = (e) => {
        const text = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();

        console.log("usłyszano:", text);

        // 1. aktywacja
        if (text.includes("punkt")) {
            armed = true;
            return;
        }

        if (!armed) return;

        // 2. komendy
        if (text.includes("dla nas")) {
            add("l");
            armed = false;
        }

        if (text.includes("wasz")) {
            add("r");
            armed = false;
        }
    };

    rec.onend = () => rec.start();
    rec.start();
}

update();
</script>

</body>
</html>
